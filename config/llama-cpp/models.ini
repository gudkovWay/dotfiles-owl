; Пресеты для роутера llama-server.
; Каждая секция = отдельная модель в выпадающем списке Zed.
; Ключи — длинные имена флагов llama-server без ведущих дефисов.

[*]
; применяется ко всем пресетам
parallel      = 1
cache-type-k  = q8_0
cache-type-v  = q8_0
flash-attn    = on
jinja         = true
fit           = on
fit-target    = 700

[qwen-text]
model     = /home/q/storage/ai/models/llm/Qwen3.8-27B-UD-IQ4_XS.gguf
ctx-size  = 16384

[qwen-vision]
model     = /home/q/storage/ai/models/llm/Qwen3.8-27B-UD-IQ4_XS.gguf
mmproj    = /home/q/storage/ai/models/llm/mmproj-F16.gguf
ctx-size  = 12288

[qwen-big]
; большой контекст под разбор целых кусков репозитория
; цена: ~9 ток/с против 20 у qwen-text
model     = /home/q/storage/ai/models/llm/Qwen3.8-27B-UD-IQ4_XS.gguf
ctx-size  = 131072
