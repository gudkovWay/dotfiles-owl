# Vader 5 Pro Configuration
#
# Шесть дополнительных кнопок отдаются в игры как Numpad 1-6.
# По умолчанию драйвер шлёт их кодами BTN_TRIGGER_HAPPY1-8, которые
# Wine/DirectInput и большинство движков не перечисляют в биндах.
#
# Раньше тут были F13-F18, и это не работало: игры читают клавиатуру
# через DirectInput, а он оперирует скан-кодами. У F13-F24 скан-кода
# в наборе PC/AT нет, поэтому клавиша доходила до X11 с верным keysym,
# но сквозь Wine не проходила. У numpad скан-коды есть.
# На клавиатуре Ergohaven K:03 нумпада нет, так что конфликтов не будет.
#
# emulate_elite = true нужен для крестовины: этот флаг задаёт USB-идентификатор
# виртуального пада (045e:0b00 = Xbox Elite 2 вместо 37d7:2401 = Flydigi).
# Без него SDL/Steam Input не опознают пад, он не появляется в списке
# контроллеров Content Manager, и крестовина никуда не мапится.
#
# В апстриме true отключал секцию [remap]; снято локальным патчем
# в src/gamepad.cpp (process_base_remaps). Драйвер пересобран и установлен.

emulate_elite = true

[gyro]
mode = "off"                # off / mouse / joystick

[stick.left]
deadzone = 128

[stick.right]
deadzone = 128

# ═══════════════════════════════════════════════════════════════
# Дополнительные кнопки -> клавиши
# ═══════════════════════════════════════════════════════════════
# Имена слева — как их называет драйвер (см. docs/protocol.md, байт 13).
# Оригинальная кнопка геймпада при этом подавляется, дублей не будет.

[remap]
C  = "KEY_KP1"    # у левого триггера
Z  = "KEY_KP2"    # у правого триггера
LM = "KEY_KP3"    # у левого триггера
RM = "KEY_KP4"    # у правого триггера
M1 = "KEY_KP5"    # задняя
M2 = "KEY_KP6"    # задняя (в железе это паддл M3 — см. uinput.cpp:46)

# Секции [layer.aim] и [layer.mouse] удалены намеренно: они занимали
# LM/RM под тап-холд, из-за чего эти кнопки нельзя было отдать играм.
# Старый конфиг лежит рядом в config.toml.bak-*
