# Разбор сессий, который раньше был вечерним таймером.
#
# Три входа, у каждого своя роль:
#   service — считает состояние и гоняет обход. Один на всю сессию.
#   widget  — счётчик в баре. Живёт на каждом мониторе, поэтому сам ничего
#             не считает: только показывает то, что положила служба.
#   panel   — список карточек, вердикты и решения по помеченному.
#
# Хозяйство лежит в /home/q/storage/ai; вся работа делается его же
# скриптами (bin/pass.sh, bin/triage.py), плагин ничего не дублирует.

id = "q/ai-triage"
name = "AI Triage"
version = "1.0.0"
plugin_api = 18
author = "q"
license = "MIT"
dependencies = []
tags = ["productivity"]
icon = "checklist"
description = "Разбор сессий Claude и прогонов Qwen: что из них класть в поисковый индекс."

[[widget]]
# Идентификатор входа виджета — это ещё и имя типа, которым он зовётся в
# баре (`end = [ ..., "ai-triage-widget", ... ]`), и живёт оно в общем поле
# со встроенными: "tray", "clock", "media". Поэтому длинно и с плагином в
# имени, а не «bar». Заодно оно должно быть уникально внутри плагина —
# «triage» уже занят панелью.
id = "ai-triage-widget"
entry = "widget.luau"

# Панель открывается от виджета, поэтому ни placement, ни position не заданы:
# хост сам прицепит её к бару. Высота — чтобы список карточек был списком,
# а не щёлкой в три строки.
[[panel]]
id = "triage"
entry = "panel.luau"
width = 780
height = 660

[[service]]
id = "watch"
entry = "service.luau"
