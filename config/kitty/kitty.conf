background_opacity          0.85
dynamic_background_opacity  yes
cursor_trail                2
window_padding_width        4

disable_ligatures never
font_size 16
# font_family Agave NerdFont Mono
# font_family Kode Mono
font_family OCR A Std

include themes/noctalia.conf
include /home/q/.config/kitty-skins/active/kitty.conf

# --- keybindings ---
# ctrl+shift+n: новое окно внутри таба (как ctrl+shift+enter) сразу с запущенным omp (ohmypi)
# перекрывает дефолтный new_os_window; ascii-fallback покрывает русскую раскладку (т)
map --allow-fallback=shifted,ascii ctrl+shift+n launch --type=window --cwd=current fish -C 'omp --allow-home'

# ctrl+shift+w НЕ переопределяем: дефолтный close_window закрывает сфокусированный
# kitty-сплит и сам умеет русскую раскладку (--allow-fallback=shifted,ascii).
# Окна tmux закрываем из tmux: prefix k.

# перемещение между окнами kitty (сплитами) внутри таба: действия дефолтные,
# но дефолтные бинды ]/[ без ascii-fallback не живут в русской раскладке (ъ, х)
map --allow-fallback=shifted,ascii ctrl+shift+] next_window
map --allow-fallback=shifted,ascii ctrl+shift+[ previous_window

# ctrl+backspace: удалить слово целиком (fish: backward-kill-token).
# В tmux fish не может включить kitty keyboard protocol, и kitty шлёт
# legacy-байт, который fish за удаление слова не принимает. Шлём CSI-u:
# fish 4 парсит её напрямую, tmux 3.7 пропускает в панель как есть.
map ctrl+backspace send_text all \x1b[127;5u

# ── пульт (remote-ai-manage) ────────────────────────────────────────────────
# Сокет абстрактный (@): живёт в пространстве имён ядра, к нему нельзя
# подключиться по сети и его не видно другому пользователю. Доступ получает
# тот, кто и так может писать в /proc твоих процессов.
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

# Ctrl+click: Herdr owns captured mouse events; Kitty owns uncaptured links.
include /home/q/.local/share/omp/herdr-local-files/kitty.conf
