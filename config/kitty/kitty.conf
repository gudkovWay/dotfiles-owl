background_opacity          0.6
cursor_trail                1
window_padding_width        25

disable_ligatures never
font_size 13
# font_family Agave NerdFont Mono
font_family Kode Mono

include themes/noctalia.conf

# --- keybindings ---
# ctrl+shift+n: новое окно внутри таба (как ctrl+shift+enter) сразу с запущенным claude
# перекрывает дефолтный new_os_window
map ctrl+shift+n launch --type=window --cwd=current fish -C claude
# то же самое на кириллической раскладке (т = та же физическая клавиша, что и n)
map ctrl+shift+т launch --type=window --cwd=current fish -C claude
