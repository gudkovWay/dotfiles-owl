# НЕ РЕДАКТИРОВАТЬ: генерируется Noctalia-шаблоном tmux_colors.
# Подключается из ~/.config/tmux/tmux.conf (if-shell в блоке статуса);
# post_hook шаблона сам делает `tmux source-file` этого файла.
set -g status-style "fg=#e3e2e3,bg=#121415"
set -g status-left "#[bold]#{session_name}#[nobold] "
set -g status-left-length 24
set -g status-right " %H:%M"
setw -g window-status-format " #{window_index}:#{window_name} "
setw -g window-status-current-style "fg=#121415,bg=#bcc8d1,bold"
setw -g window-status-current-format " #{window_index}:#{window_name} "
