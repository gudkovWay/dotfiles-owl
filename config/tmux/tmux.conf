# ~/.config/tmux/tmux.conf — база + QoL-слой
#
# Задача tmux здесь — не «ещё один оконный менеджер», а канал и дом для
# AI-сессий (omp, claude): пульт remote-ai-manage пишет в панели через
# `tmux send-keys -t %N`, хук сессии отдаёт панель в `$TMUX_PANE`. Поэтому
# каждый параметр ниже — либо работа канала, либо комфорт полноэкранных TUI.
#
# QoL-слой по мотивам micahkepe.com/blog/tmux-config: sessionizer, fzf-попапы,
# vim-tmux-navigator, resurrect/continuum. Палитра статус-бара — Nibelung Dark,
# единая с nvim (lua/config/palette.lua): смена темы = правка двух мест.

# --- канал пульта ---------------------------------------------------------
# Сервер не умирает с последней сессией: пульт поднимает окна сам, и гонка
# «сервер уже мёртв / ещё не родился» ему не нужна.
set -g exit-empty off

# --- полноэкранные TUI (omp / claude / neovim) -----------------------------
# Мгновенный отклик на Esc: TUI сами разбирают последовательности, лишняя
# задержка ломает навигацию внутри них.
set -gs escape-time 0
# Фокус-события до приложений: TUI знают, когда на них смотрят.
set -g focus-events on
# Проброс управляющих последовательностей (kitty-графика и пр.) сквозь tmux.
set -g allow-passthrough on
# Отличимые модифицированные клавиши через xterm modifyOtherKeys. ВАЖНО (проверено
# 2026-09-12): kitty modifyOtherKeys отвергает ( «superseded by the kitty keyboard
# protocol»), а kitty-протокол tmux 3.7 наружу не говорит — поэтому Ctrl+Enter и
# Shift+Enter через kitty+tmux не проходят в принципе: tmux схлопывает входящие
# CSI-u последовательности в \n ещё до приложения. Опция оставлена для внешних
# терминалов с поддержкой modifyOtherKeys (Ghostty/WezTerm при ssh-attach пульта).
# В kitty+tmux перенос строки в промпте omp — Alt+Enter (ESC+CR проходит нативно);
# Ctrl+Q — поставить сообщение в очередь follow-up.
set -g extended-keys on
# Длинная история: AI-сессия печатает много, разбирать потом — обычное дело.
set -g history-limit 100000

# --- цвета ------------------------------------------------------------------
set -g default-terminal "tmux-256color"
# Внутри kitty терминал умеет 24-битный цвет и extended keys (RGB — цвет,
# extkeys — расширенные клавиши для TUI, см. блок выше); сообщаем tmux,
# чтобы не деградировал.
set -ga terminal-features ",xterm-kitty:RGB:extkeys"

# --- быт --------------------------------------------------------------------
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# --- префикс C-a; двойное нажатие отправляет C-a в приложение ---------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- перезагрузка конфига ---------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf перезагружен"

# --- окна и панели ----------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind -n S-Left previous-window
bind -n S-Right next-window
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# закрыть текущее окно сразу, без confirm (как &, но без y/n)
bind k kill-window
# закрыть текущую панель сразу, без confirm (дефолтный x спрашивает y/n)
bind x kill-pane


# --- sessionizer: fzf-выбор проекта → сессия в его каталоге -----------------
# Каталоги поиска — внутри ~/.local/bin/tmux-sessionizer
# (~/dev, ~/storage/projects, ~/games).
bind f display-popup -E -w 80% -h 60% ~/.local/bin/tmux-sessionizer

# --- переключение сессий fzf-попапом ----------------------------------------
# Дефолтный choose-tree сессий заменён; дерево окон остаётся на prefix w.
bind s display-popup -E -w 70% -h 60% ~/.local/bin/tmux-fzf-sessions

# --- copy-mode vi + буфер обмена (OSC52: kitty локально и по SSH) -----------
setw -g mode-keys vi
set -g set-clipboard on
# Wayland-клипборд внутри панелей: сервер стартует continuum'ом при логине ещё
# без WAYLAND_DISPLAY, а update-environment при SSH-attach (пульт) вдобавок
# вычищает переменную из окружения сессии. Без неё omp не видит Wayland-клипборд
# — Ctrl+V на картинке даёт «Clipboard is empty». Поэтому переменную убрали из
# update-environment и синхронизируем сами: скрипт находит wayland-сокет и
# прописывает его в глобальное окружение и во все сессии (при старте сервера
# и на каждый attach).
#
# Старт сервера упорядочен дроп-ином ~/.config/systemd/user/tmux.service.d/
# (After=graphical-session.target + ожидание сокета), а синк при загрузке конфига
# блокирующий (без -b): глобальное окружение готово ДО того, как continuum-restore
# заспавнит панели. Уже запущенные процессы окружение не обновляют — панель,
# восстановленную со сломанным env, надо пересоздать (respawn-pane/new window).
run '/home/q/.config/tmux/sync-wayland.sh'
set-hook -g client-attached "run -b '/home/q/.config/tmux/sync-wayland.sh'"
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear

# --- бесшовная навигация nvim <-> tmux (vim-tmux-navigator) -----------------
# nvim-сторона: lua/plugins/tmux.lua. Внутри nvim C-h/j/k/l двигают сплиты,
# у края плагин сам переключает панель tmux. Паттерн ниже решает обратное:
# панель не-vim → клавиша листает панели tmux; fzf в паттерне — чтобы в
# fzf-попапах C-h/j/k/l уходили в fzf, а не листали панели под ним.
# Исключение: C-l в не-vim панели без соседа справа (#{pane_at_right})
# уходит в приложение — shell сохраняет привычную очистку экрана.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n 'C-j' if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n 'C-k' if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n 'C-l' if-shell "$is_vim" "send-keys C-l" \
    "if-shell -F '#{pane_at_right}' 'send-keys C-l' 'select-pane -R'"
bind -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

# --- кириллические дубли биндов (русская раскладка, те же физические клавиши) --
# Механика: Ctrl+кириллическая буква приходит в tmux уже control-байтом латинской
# буквы той же физической клавиши (kitty переводит через alternate_key из
# us-раскладки: Ctrl-ф -> \x01, Ctrl-р -> \x08) — префикс C-a, навигатор
# C-h/j/k/l, SIGINT и пр. в русской раскладке работают без этого блока.
# Буквы БЕЗ модификаторов приходят кириллицей как текст («к» вместо «r») —
# их дублируем. Соответствие ru(winkeys): q-й w-ц e-у r-к t-е y-н u-г i-ш
# o-щ p-з [-х ]-ъ a-ф s-ы d-в f-а g-п h-р j-о k-л l-д ;-ж '-э z-я x-ч c-с
# v-м b-и n-т m-ь ,-б .-ю /-. `-ё
set -g prefix2 C-ф
# prefix2 срабатывает в терминалах с modifyOtherKeys (ghostty/wezterm по SSH
# с пульта), где Ctrl-ф приходит отличимой последовательностью, а не \x01;
# в kitty префикс ловится как обычный C-a.
bind C-ф send-prefix
# кастомные бинды
bind к source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf перезагружен"
bind а display-popup -E -w 80% -h 60% ~/.local/bin/tmux-sessionizer
bind ы display-popup -E -w 70% -h 60% ~/.local/bin/tmux-fzf-sessions
bind л kill-window
bind ч kill-pane
bind -r Р resize-pane -L 5
bind -r О resize-pane -D 5
bind -r Л resize-pane -U 5
bind -r Д resize-pane -R 5
# часто используемые дефолты
bind с new-window
bind т next-window
bind з previous-window
bind в detach-client
bind д last-window
bind х copy-mode
bind ъ paste-buffer -p
bind б command-prompt -I "#W" { rename-window "%%" }
bind ю command-prompt -T target { move-window -t "%%" }
bind ц choose-tree -Zw
# tpm: prefix I/U в русской раскладке это Ш/Г
bind Ш run-shell '~/.tmux/plugins/tpm/bindings/install_plugins'
bind Г run-shell '~/.tmux/plugins/tpm/bindings/update_plugins'
# copy-mode-vi: навигация и выделение (v V y C-v и h j k l w b e g G n N q)
bind -T copy-mode-vi м send -X begin-selection
bind -T copy-mode-vi М send -X select-line
bind -T copy-mode-vi C-м send -X rectangle-toggle
bind -T copy-mode-vi н send -X copy-pipe-and-cancel
bind -T copy-mode-vi р send -X cursor-left
bind -T copy-mode-vi о send -X cursor-down
bind -T copy-mode-vi л send -X cursor-up
bind -T copy-mode-vi д send -X cursor-right
bind -T copy-mode-vi ц send -X next-word
bind -T copy-mode-vi и send -X previous-word
bind -T copy-mode-vi у send -X next-word-end
bind -T copy-mode-vi г send -X history-top
bind -T copy-mode-vi П send -X history-bottom
bind -T copy-mode-vi т send -X search-again
bind -T copy-mode-vi Т send -X search-reverse
bind -T copy-mode-vi й send -X cancel
bind -T copy-mode-vi Х send -X previous-paragraph
bind -T copy-mode-vi Ъ send -X next-paragraph
# «/» в русской раскладке даёт «.» — поиск и по нему
bind -T copy-mode-vi . command-prompt -T search -p "(search down)" { send-keys -X search-forward -- "%%" }
# навигатор C-h/j/k/l: в modifyOtherKeys-терминалах Ctrl-кириллица приходит
# отдельной клавишей C-р/C-о/C-л/C-д, дублируем раскладку (kitty шлёт \x08..)
bind -n 'C-р' if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n 'C-о' if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n 'C-л' if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n 'C-д' if-shell "$is_vim" "send-keys C-l" \
    "if-shell -F '#{pane_at_right}' 'send-keys C-l' 'select-pane -R'"
bind -T copy-mode-vi C-р select-pane -L
bind -T copy-mode-vi C-о select-pane -D
bind -T copy-mode-vi C-л select-pane -U
bind -T copy-mode-vi C-д select-pane -R

# --- статус-бар: Nibelung Dark (= nvim lua/config/palette.lua) --------------
set -g status-interval 5
set -g status-style "fg=#CED4DA,bg=#212529"
# сессия акцентным блоком, дальше powerline-разделитель
set -g status-left "#[fg=#212529,bg=#9BB1FF,bold]  #S #[fg=#9BB1FF,bg=#212529,nobold]"
set -g status-left-length 32
# справа: каталог активной панели (с ~ вместо $HOME, укорочен слева) + дата/время
set -g status-right "#[fg=#6C757D] #{=/-28/...:#{s|^/home/q|~|:pane_current_path}} #[fg=#ADB5BD]  %d.%m #[fg=#CED4DA,bold]%H:%M#[nobold]"
set -g status-right-length 64
setw -g window-status-separator "#[fg=#6C757D] "
setw -g window-status-format "#[fg=#ADB5BD] #{window_index}:#{window_name} "
setw -g window-status-current-style "fg=#212529,bg=#9BB1FF,bold"
setw -g window-status-current-format " #{window_index}:#{window_name} "

# --- tpm + плагины ------------------------------------------------------------
# prefix I — установка, prefix U — обновление, prefix C-s/C-r — сохранить/
# восстановить сессии вручную (resurrect). continuum autosave каждые 15 мин,
# автозапуск сервера при логине и авторестор после ребута.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

# Инициализация tpm (всегда последняя строка).
run '~/.tmux/plugins/tpm/tpm'
