# Capturing applications (Herdr) must receive the complete Ctrl-click.
mouse_map ctrl+left press grabbed
mouse_map ctrl+left release grabbed
# Without a mouse grab Kitty owns link activation.
mouse_map ctrl+left press ungrabbed discard_event
mouse_map ctrl+left release ungrabbed mouse_handle_click link
# Images need a local file before the system can select their MIME application.
open_url_with bun /home/q/.local/share/omp/herdr-local-files/open-file.ts
