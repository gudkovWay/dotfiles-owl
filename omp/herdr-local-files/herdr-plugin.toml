id = "omp.local-files"
name = "OMP Local Files"
version = "1.1.0"
min_herdr_version = "0.9.0"
platforms = ["linux"]

[[actions]]
id = "open"
title = "Open local file or image"
command = ["bun", "open-file.ts"]

[[link_handlers]]
id = "local-file"
title = "Open local file"
pattern = '^file://(?:localhost)?/'
action = "open"

[[link_handlers]]
id = "remote-image"
title = "Open image in default viewer"
pattern = '(?i)^https?://[^?#]*\.(?:apng|avif|bmp|gif|ico|jpe?g|png|svg|tiff?|webp)(?:[?#].*)?$'
action = "open"
