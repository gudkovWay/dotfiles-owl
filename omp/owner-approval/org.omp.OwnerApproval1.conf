<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="org.omp.OwnerApproval1"/>
    <deny send_destination="org.omp.OwnerApproval1"/>
  </policy>
  <policy user="root">
    <allow own="org.omp.OwnerApproval1"/>
  </policy>
  <policy user="@OWNER@">
    <allow send_destination="org.omp.OwnerApproval1"/>
  </policy>
</busconfig>
